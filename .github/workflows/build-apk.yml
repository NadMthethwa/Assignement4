name: Build Android APK

on:
  push:
    paths:
      - "glade_quest/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glade_quest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/glade-quest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: glade-quest-apk
          path: glade_quest/build/glade-quest.apk

      - name: Publish APK as a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Glade Quest APK (latest build)
          body: |
            Latest Android build of Glade Quest from `${{ github.ref_name }}` (${{ github.sha }}).
            Open this page on your phone, tap **glade-quest.apk**, then allow installing from your browser.
          prerelease: false
          make_latest: true
          files: glade_quest/build/glade-quest.apk
